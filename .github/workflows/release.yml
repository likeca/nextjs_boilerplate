# GitHub Actions - Repository secrets
# HOST
# PORT
# USERNAME
# FOLDER
# PRIVATE_KEY

# Ubuntu: Add "CASignatureAlgorithms +ssh-rsa" to /etc/ssh/sshd_config
# Ubuntu: Add id_rsa.pub to authorized_keys

name: Release to lhchub.com

on:
  push:
    branches: [develop]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Remote ssh
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            # 0. Environment: pnpm 
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"  # This loads nvm
            [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"  # This loads nvm bash_completion

            # 1. Update code from github
            cd /home/${{ secrets.USERNAME }}/${{ secrets.FOLDER }}/ && /usr/bin/git pull

            # 2. Update packages
            cd /home/${{ secrets.USERNAME }}/${{ secrets.FOLDER }}/ && pnpm install

            # 3. Copy static files to STATIC_ROOT
            # source /home/${{ secrets.USERNAME }}/${{ secrets.FOLDER }}/ && ./build.sh

